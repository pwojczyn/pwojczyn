name: Update profile statistics

on:
  schedule:
    # Weekly, Monday 04:17 UTC. Avoids a noisy daily commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-statistics
  cancel-in-progress: false

jobs:
  update:
    name: Refresh public statistics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Show Node.js version
        run: node --version

      - name: Refresh statistics from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs

      - name: Check generated Markdown
        run: git diff --check

      - name: Commit and push only when content changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/README.pl.md; then
            echo "No statistics changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.pl.md
          git commit -m "chore: refresh profile statistics"
          git push
